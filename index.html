<!DOCTYPE html>
<html lang="en">
<head>
	<title>Bengaluru Metro Map</title>
	<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e293b'/%3E%3Cpath d='M20 42 L32 22 L44 42' stroke='%23f8fafc' stroke-width='3' fill='none'/%3E%3Ccircle cx='20' cy='42' r='6' fill='%23ba68c8'/%3E%3Ccircle cx='32' cy='22' r='6' fill='%234CAF50'/%3E%3Ccircle cx='44' cy='42' r='6' fill='%23ffff00'/%3E%3C/svg%3E">
    <meta name="description" content="Interactive map of Bengaluru's Namma Metro: all 83 operational stations across the Purple, Green and Yellow lines, with station search and Wikipedia summaries.">
    <meta property="og:title" content="Namma Metro Map: Bengaluru Metro, interactive">
    <meta property="og:description" content="All 83 operational Namma Metro stations on one interactive map: Purple, Green and Yellow lines, station search and Wikipedia summaries.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://manubhargav.github.io/NammaMetroMap/">
    <meta property="og:image" content="https://manubhargav.github.io/NammaMetroMap/assets/og.png">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
	<!-- Hamburger menu that opens up the Sidebar-->
	<button type="button" class="menu-icon" onclick="openview()" aria-label="Open station list">
		<svg viewBox="0 0 24 24" width="32" height="32" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
	</button>
	<!-- Sidebar showing Heading, Filter box and List of items-->
	<aside id="sidebar" inert aria-hidden="true">
		<h1 class="heading">
			<span>Namma Metro Map</span>
			<span class="heading-actions">
				<button type="button" class="lang-toggle" aria-label="Toggle Kannada station names" data-bind="click: function() { kannada(!kannada()); }, attr: { 'aria-pressed': kannada() ? 'true' : 'false' }, text: kannada() ? 'EN' : 'ಕನ್ನಡ'">ಕನ್ನಡ</button>
				<button type="button" class="close-icon" onclick="closeview()" aria-label="Close station list">
					<svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
				</button>
			</span>
		</h1>
		<div class="tabs" role="tablist" aria-label="Metro lines">
            <button type="button" class="tab-btn" data-tab="explore" role="tab" data-bind="click: function() { activeTab('explore'); }, css: { active: activeTab() === 'explore' }, attr: { tabindex: activeTab() === 'explore' ? 0 : -1, 'aria-selected': activeTab() === 'explore' ? 'true' : 'false' }">All</button>
            <button type="button" class="tab-btn" data-tab="purple" role="tab" data-bind="click: function() { activeTab('purple'); }, css: { active: activeTab() === 'purple' }, attr: { tabindex: activeTab() === 'purple' ? 0 : -1, 'aria-selected': activeTab() === 'purple' ? 'true' : 'false' }">Purple</button>
            <button type="button" class="tab-btn" data-tab="green" role="tab" data-bind="click: function() { activeTab('green'); }, css: { active: activeTab() === 'green' }, attr: { tabindex: activeTab() === 'green' ? 0 : -1, 'aria-selected': activeTab() === 'green' ? 'true' : 'false' }">Green</button>
            <button type="button" class="tab-btn" data-tab="yellow" role="tab" data-bind="click: function() { activeTab('yellow'); }, css: { active: activeTab() === 'yellow' }, attr: { tabindex: activeTab() === 'yellow' ? 0 : -1, 'aria-selected': activeTab() === 'yellow' ? 'true' : 'false' }">Yellow</button>
            <button type="button" class="tab-btn" data-tab="routing" role="tab" data-bind="click: function() { activeTab('routing'); }, css: { active: activeTab() === 'routing' }, attr: { tabindex: activeTab() === 'routing' ? 0 : -1, 'aria-selected': activeTab() === 'routing' ? 'true' : 'false' }">Route</button>
        </div>
        
        <div class="tab-content">
            <div style="position: relative; margin: 10px 20px;" data-bind="visible: activeTab() !== 'routing'">
                <label for="station-search" class="sr-only">Search stations</label>
                <input type="text" id="station-search" class="filter" aria-describedby="station-count" data-bind="textInput: query, event: { keydown: function(data, event) { if (event.key === 'Enter') { fitToResults(); } return true; } }" placeholder="Search stations" style="margin: 0; width: 100%; padding-right: 30px;">
                <button type="button" class="clear-filter" aria-label="Clear search" data-bind="visible: query().length > 0, click: function() { query(''); }">
	                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                </button>
            </div>
            <div class="result-count" id="station-count" aria-live="polite" data-bind="visible: activeTab() !== 'routing', text: resultCountText"></div>
		    <ul data-bind="foreach: filterResults">
			    <li><button type="button" class="station-row" data-bind="click: $parent.displayInfo, event: { mouseover: $parent.hoverStation, mouseout: $parent.hoverStationOut }, style: { borderLeftColor: $parent.lineColors[lines[0]] || '#334155' }">
					<span class="station-primary" data-bind="text: $parent.kannada() && nameKn ? nameKn : name, attr: { lang: $parent.kannada() && nameKn ? 'kn' : 'en' }"></span>
					<span class="station-secondary" data-bind="visible: $parent.kannada() && nameKn, text: name"></span>
				</button></li>
		    </ul>
            <div class="empty-state" data-bind="visible: activeTab() !== 'routing' && filterResults().length === 0">
                No stations match &ldquo;<span data-bind="text: query"></span>&rdquo;.
                <button type="button" data-bind="click: function() { query(''); }">Clear search</button>
            </div>

            <!-- Journey planner -->
            <div class="route-panel" data-bind="visible: activeTab() === 'routing'">
                <div class="route-field">
                    <label for="route-from">From</label>
                    <input id="route-from" type="text" list="station-list" placeholder="Start station" autocomplete="off" data-bind="textInput: routeFrom">
                </div>
                <button type="button" class="route-swap" aria-label="Swap start and destination" title="Swap stations" data-bind="click: swapRoute">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 4v16M7 4L4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"></path>
                    </svg>
                </button>
                <div class="route-field">
                    <label for="route-to">To</label>
                    <input id="route-to" type="text" list="station-list" placeholder="Destination station" autocomplete="off" data-bind="textInput: routeTo">
                </div>
                <datalist id="station-list" data-bind="foreach: locations">
                    <option data-bind="attr: { value: $parent.kannada() && nameKn ? nameKn : name }"></option>
                </datalist>
                <div class="route-actions">
                    <button type="button" class="route-find" data-bind="click: findRoute">Find route</button>
                    <button type="button" class="route-clear" data-bind="click: clearRoute">Clear</button>
                </div>
                <div class="route-error" role="alert" data-bind="visible: routeError, text: routeError"></div>
                <div class="route-result" data-bind="visible: routeResult">
                    <div class="route-summary" data-bind="text: routeSummary"></div>
                    <ol class="route-steps" data-bind="foreach: routeSteps">
                        <li data-bind="css: { interchange: isTransfer }">
                            <span class="step-name" data-bind="text: name"></span>
                            <span class="step-meta">
                                <span class="step-line" data-bind="text: lineBadge, style: { background: lineColor, color: lineTextColor }"></span>
                                <span class="step-transfer" data-bind="visible: isTransfer, text: transferText"></span>
                            </span>
                        </li>
                    </ol>
                    <div class="route-estimate-note">Stops and time are estimates, not a timetable.</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            Built by <a href="https://manubhargav.github.io" target="_blank" rel="noopener noreferrer">Manu Bhargav</a>
        </div>
	</aside>
	<!-- Tap-to-close dim layer behind the sidebar on phones/tablets -->
	<div id="sidebar-backdrop" aria-hidden="true" onclick="closeview()"></div>
	<!-- Whole page Leaflet Map (with Locations of each item). Placed after the
	     sidebar in DOM order so keyboard focus reaches sidebar controls first. -->
	<main id="map"></main>
	<!-- Replay the endpoint tour on demand -->
	<button type="button" id="tour-replay" aria-label="Show line endpoints" title="Show line endpoints" onclick="replayTour()">?</button>
	<!-- Basemap failure / offline notification -->
	<div id="map-toast" role="status" style="display:none">
		<span id="map-toast-text"></span>
		<button type="button" id="map-toast-close" aria-label="Dismiss notification" onclick="hideMapToast()">&times;</button>
	</div>
	<!-- Hidden SVG for custom linear gradients (diagonal 2 to 8 o'clock split for interchange stations) -->
	<svg style="width:0; height:0; position:absolute;" aria-hidden="true">
		<defs>
			<linearGradient id="purple-green-gradient" x1="0" y1="0" x2="1" y2="1">
				<stop offset="50%" stop-color="#ba68c8" />
				<stop offset="50%" stop-color="#4CAF50" />
			</linearGradient>
			<linearGradient id="green-yellow-gradient" x1="0" y1="0" x2="1" y2="1">
				<stop offset="50%" stop-color="#4CAF50" />
				<stop offset="50%" stop-color="#ffff00" />
			</linearGradient>
		</defs>
	</svg>
	<!-- Knockout JavaSciprt library -->
	<script src="js/knockout-3.4.1.js"></script>
	<!-- jQuery JavaScript libray -->
	<script src="js/jquery-3.1.1.min.js"></script>
	<!-- Custom JavaScript for App functionality -->
	<script src="js/locations.js"></script>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
	<script src="js/app.js"></script>
</body>
</html>
