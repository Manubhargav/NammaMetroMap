<!DOCTYPE html>
<html lang="en">
<head>
	<title>Bengaluru Metro Map</title>
	<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
	<!-- Hamburger menu that opens up the Sidebar-->
	<button type="button" class="menu-icon" onclick="openview()" aria-label="Open station list">
		<svg viewBox="0 0 24 24" width="32" height="32" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
	</button>
	<!-- Sidebar showing Heading, Filter box and List of items-->
	<aside id="sidebar" inert aria-hidden="true">
		<h1 class="heading">
			Namma Metro Map
            <button type="button" class="close-icon" onclick="closeview()" aria-label="Close station list">
	            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
			</button>
		</h1>
		<div class="tabs" role="tablist" aria-label="Metro lines">
            <button type="button" class="tab-btn" data-tab="explore" role="tab" data-bind="click: function() { activeTab('explore'); }, css: { active: activeTab() === 'explore' }, attr: { tabindex: activeTab() === 'explore' ? 0 : -1, 'aria-selected': activeTab() === 'explore' ? 'true' : 'false' }">All</button>
            <button type="button" class="tab-btn" data-tab="purple" role="tab" data-bind="click: function() { activeTab('purple'); }, css: { active: activeTab() === 'purple' }, attr: { tabindex: activeTab() === 'purple' ? 0 : -1, 'aria-selected': activeTab() === 'purple' ? 'true' : 'false' }">Purple</button>
            <button type="button" class="tab-btn" data-tab="green" role="tab" data-bind="click: function() { activeTab('green'); }, css: { active: activeTab() === 'green' }, attr: { tabindex: activeTab() === 'green' ? 0 : -1, 'aria-selected': activeTab() === 'green' ? 'true' : 'false' }">Green</button>
            <button type="button" class="tab-btn" data-tab="yellow" role="tab" data-bind="click: function() { activeTab('yellow'); }, css: { active: activeTab() === 'yellow' }, attr: { tabindex: activeTab() === 'yellow' ? 0 : -1, 'aria-selected': activeTab() === 'yellow' ? 'true' : 'false' }">Yellow</button>
        </div>
        
        <div class="tab-content">
            <div style="position: relative; margin: 10px 20px;">
                <label for="station-search" class="sr-only">Search stations</label>
                <input type="text" id="station-search" class="filter" aria-describedby="station-count" data-bind="textInput: query, event: { keydown: function(data, event) { if (event.key === 'Enter') { fitToResults(); } return true; } }" placeholder="Search stations" style="margin: 0; width: 100%; padding-right: 30px;">
                <button type="button" class="clear-filter" aria-label="Clear search" data-bind="visible: query().length > 0, click: function() { query(''); }">
	                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                </button>
            </div>
            <div class="result-count" id="station-count" aria-live="polite" data-bind="visible: activeTab() !== 'routing', text: resultCountText"></div>
		    <ul data-bind="foreach: filterResults">
			    <li><button type="button" class="station-row" data-bind="text: name, click: $parent.displayInfo, event: { mouseover: $parent.hoverStation, mouseout: $parent.hoverStationOut }, style: { borderLeftColor: $parent.lineColors[lines[0]] || '#334155' }"></button></li>
		    </ul>
            <div class="empty-state" data-bind="visible: activeTab() !== 'routing' && filterResults().length === 0">
                No stations match &ldquo;<span data-bind="text: query"></span>&rdquo;.
                <button type="button" data-bind="click: function() { query(''); }">Clear search</button>
            </div>
        </div>
        
        <div class="footer">
            Built by <a href="https://manubhargav.github.io" target="_blank" rel="noopener noreferrer">Manu Bhargav</a>
        </div>
	</aside>
	<!-- Tap-to-close dim layer behind the sidebar on phones/tablets -->
	<div id="sidebar-backdrop" aria-hidden="true" onclick="closeview()"></div>
	<!-- Whole page Leaflet Map (with Locations of each item). Placed after the
	     sidebar in DOM order so keyboard focus reaches sidebar controls first. -->
	<main id="map"></main>
	<!-- Hidden SVG for custom linear gradients (diagonal 2 to 8 o'clock split for interchange stations) -->
	<svg style="width:0; height:0; position:absolute;" aria-hidden="true">
		<defs>
			<linearGradient id="purple-green-gradient" x1="0" y1="0" x2="1" y2="1">
				<stop offset="50%" stop-color="#ba68c8" />
				<stop offset="50%" stop-color="#4CAF50" />
			</linearGradient>
			<linearGradient id="green-yellow-gradient" x1="0" y1="0" x2="1" y2="1">
				<stop offset="50%" stop-color="#4CAF50" />
				<stop offset="50%" stop-color="#ffff00" />
			</linearGradient>
		</defs>
	</svg>
	<!-- Knockout JavaSciprt library -->
	<script src="js/knockout-3.4.1.js"></script>
	<!-- jQuery JavaScript libray -->
	<script src="js/jquery-3.1.1.min.js"></script>
	<!-- Custom JavaScript for App functionality -->
	<script src="js/locations.js"></script>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
