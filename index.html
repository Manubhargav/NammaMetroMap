<!DOCTYPE html>
<html lang="en">
<head>
	<title>Bengaluru Metro Map</title>
	<meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, user-scalable=yes">
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
	<!-- Whole page Google Map (with Locations of each item)-->
	<div id="map"></div>
	<!-- Hamburger menu that opens up the Sidebar-->
	<svg class="menu-icon" onclick="openview()" style="cursor:pointer" viewBox="0 0 24 24" width="32" height="32" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
	<!-- Sidebar showing Heading, Filter box and List of items-->
	<div id="sidebar">
		<div class="heading">
			Namma Metro Map
            <svg class="close-icon" onclick="closeview()" style="cursor:pointer" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
		</div>
		<div class="tabs">
            <button class="tab-btn" data-bind="click: function() { activeTab('explore'); }, css: { active: activeTab() === 'explore' }">All</button>
            <button class="tab-btn" data-bind="click: function() { activeTab('purple'); }, css: { active: activeTab() === 'purple' }">Purple</button>
            <button class="tab-btn" data-bind="click: function() { activeTab('green'); }, css: { active: activeTab() === 'green' }">Green</button>
            <button class="tab-btn" data-bind="click: function() { activeTab('yellow'); }, css: { active: activeTab() === 'yellow' }">Yellow</button>
        </div>
        
        <div class="tab-content">
            <div style="position: relative; margin: 10px 20px;">
                <input type="text" class="filter" data-bind="textInput: query" placeholder="Search stations" style="margin: 0; width: 100%; padding-right: 30px;">
                <svg data-bind="visible: query().length > 0, click: function() { query(''); }" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b;" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
		    <ul data-bind="foreach: filterResults">
			    <li data-bind="text: name, click: $parent.displayInfo, event: { mouseover: $parent.hoverStation, mouseout: $parent.hoverStationOut }, style: { borderLeftColor: $parent.lineColors[lines[0]] || '#334155' }"></li>
		    </ul>
        </div>
        
        <div class="footer">
            Built by <a href="https://manubhargav.github.io" target="_blank" rel="noopener noreferrer">Manu Bhargav</a>
        </div>
	</div>
	<!-- Hidden SVG for custom linear gradients (diagonal 2 to 8 o'clock split for interchange stations) -->
	<svg style="width:0; height:0; position:absolute;" aria-hidden="true">
		<defs>
			<linearGradient id="purple-green-gradient" x1="0" y1="0" x2="1" y2="1">
				<stop offset="50%" stop-color="#ba68c8" />
				<stop offset="50%" stop-color="#4CAF50" />
			</linearGradient>
			<linearGradient id="green-yellow-gradient" x1="0" y1="0" x2="1" y2="1">
				<stop offset="50%" stop-color="#4CAF50" />
				<stop offset="50%" stop-color="#ffff00" />
			</linearGradient>
		</defs>
	</svg>
	<!-- Knockout JavaSciprt library -->
	<script src="js/knockout-3.4.1.js"></script>
	<!-- jQuery JavaScript libray -->
	<script src="js/jquery-3.1.1.min.js"></script>
	<!-- Custom JavaScript for App functionality -->
	<script src="js/locations.js"></script>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
